components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: opaque}
    jwtBearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    TaskID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z0-9]+-[A-Z]+-\d{5}$'
        example: HISv3-BUG-00077
      description: >
        Task identifier — format `{PRODUCT}-{TYPE}-{NNNNN}` (zero-padded 5-digit sequence
        auto-assigned on creation). Examples: `HISv3-BUG-00077`, `HISv3-FEATURE-00042`,
        `HISv3-SUBTASK-00001`. Returned as `taskID` in every task response.
    XTimestamp:
      name: X-Timestamp
      in: header
      required: true
      schema:
        type: string
        example: '1700000000'
      description: >
        Current Unix time in **seconds** as a base-10 integer string
        (Python: `str(int(time.time()))`). Server rejects requests where
        `|server_time − timestamp| > 300 s` (HTTP 401 "stale timestamp").
        Generate fresh per call; never reuse.
    XNonce:
      name: X-Nonce
      in: header
      required: true
      schema:
        type: string
        example: a3f8e2b1c7d94052fe83901abc654d27
      description: >
        Unique string per request for replay protection. A second request with the same nonce
        within the 5-minute window is rejected (HTTP 409 "nonce already used").
        Generate with `secrets.token_hex(16)` in Python.
    XSignature:
      name: X-Signature
      in: header
      required: true
      schema:
        type: string
        example: 6df8ec159854f63c4cc79ba20ab2f89f93a72cb2abbba254df1d220f363044e1
      description: |
        Hex-encoded HMAC-SHA256 of the canonical request string (shared `ROUTINE_API_HMAC_SECRET`).

        **Canonical string** — five lines joined by `\n`:
        ```
        {UPPERCASE_METHOD}
        {URL_PATH_WITHOUT_QUERY_STRING}
        {lowercase_hex_SHA256_of_request_body}
        {X-Timestamp_value}
        {X-Nonce_value}
        ```
        Empty-body SHA-256: `e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855`

        **Python signing snippet** (see `scripts/routine/call_api.py` for a complete client):
        ```python
        import hashlib, hmac as _hmac, time, secrets
        body      = b''                        # empty for GET requests
        ts        = str(int(time.time()))
        nonce     = secrets.token_hex(16)
        path      = '/api/v1/search/tasks'     # path only, no ?query
        canonical = '\n'.join(['GET', path,
                               hashlib.sha256(body).hexdigest(), ts, nonce])
        sig = _hmac.new(HMAC_SECRET.encode(), canonical.encode(),
                        hashlib.sha256).hexdigest()
        ```
        Reference: `internal/apiauth/hmac.go → canonicalString()`.
  schemas:
    ArbitraryObject: {type: object, additionalProperties: true}
    ErrorResponse: {type: object, properties: {error: {type: string}}}
    AuthLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string}
    AuthImpersonateRequest:
      type: object
      description: >-
        Provide either field to resolve the target user; if both are set,
        targetUserID takes precedence.
      properties:
        targetUserID: {type: string}
        targetUsername: {type: string}
    AuthUser:
      type: object
      properties:
        id: {type: string}
        username: {type: string}
        displayName: {type: string}
        role: {type: string, description: 'Human role (Developer, DevOps, UI/UX Designer, QA, QC, Admin) or "rest-client" for a machine integration account — see /admin/api-clients. A "rest-client" role always pairs with an all-false AuthPermissions bundle and cannot sign in via the web UI.'}
        isLead: {type: boolean}
        isHead: {type: boolean}
        isTaskCoordinator: {type: boolean}
        isTaskController: {type: boolean}
        active: {type: boolean}
    AuthPermissions:
