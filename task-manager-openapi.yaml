        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Task not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Task is in a conflicting state, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '422': {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationErrorResponse'}}}}
  /api/v1/tasks/{id}/hold:
    post:
      tags: [Task API]
      security:
        - jwtBearerAuth: []
      summary: Put a task on hold
      parameters:
        - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoutineHoldRequest'}}}
      responses:
        '200': {description: Updated task summary, content: {application/json: {schema: {$ref: '#/components/schemas/RoutineTaskResponse'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Task not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Task is in a conflicting state, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '422': {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationErrorResponse'}}}}
  /api/v1/tasks/{id}/hold/lift:
    post:
      tags: [Task API]
      security:
        - jwtBearerAuth: []
      summary: Lift a task hold
      parameters:
        - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoutineActorRequest'}}}
      responses:
        '200': {description: Updated task summary, content: {application/json: {schema: {$ref: '#/components/schemas/RoutineTaskResponse'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Task not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Task is in a conflicting state, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '422': {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationErrorResponse'}}}}
  /api/v1/tasks/{id}/assignments:
    post:
      tags: [Task API]
      security:
        - jwtBearerAuth: []
      summary: Update task assignment
      parameters:
        - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoutineAssignmentRequest'}}}
      responses:
        '200': {description: Updated task summary, content: {application/json: {schema: {$ref: '#/components/schemas/RoutineTaskResponse'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Task not found or unsupported state, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Task is in a conflicting state, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '422': {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationErrorResponse'}}}}
  /api/v1/tasks/{id}/status:
    post:
      tags: [Task API]
      security:
        - jwtBearerAuth: []
      summary: Set task status
      parameters:
        - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/TaskStatusRequest'}}}
      responses:
        '200': {description: OK acknowledgement, content: {application/json: {schema: {$ref: '#/components/schemas/OKResponse'}}}}
  /api/v1/tasks/{id}/notes:
    post:
      tags: [Task API]
      security:
        - jwtBearerAuth: []
      summary: Add task note
      parameters:
        - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TaskNoteRequest'}}}
      responses:
        '200': {description: OK acknowledgement, content: {application/json: {schema: {$ref: '#/components/schemas/OKResponse'}}}}
  /api/v1/tasks/{id}/discussion:
    get:
      tags: [Task API]
      security:
        - jwtBearerAuth: []
      summary: Get task discussion thread
      description: >
        Full discussion thread (messages + per-mention WhatsApp notification
        outcome) for a task, newest-first up to `limit`. 503 when the
        discussion backend is not wired.
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - name: limit
          in: query
          description: Max messages returned (1-100). Values outside that range fall back to 100.
          schema: {type: integer, default: 100}
      responses:
        '200': {description: Discussion thread, content: {application/json: {schema: {$ref: '#/components/schemas/TaskDiscussionListResponse'}}}}
        '404': {description: Task not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {description: Discussion backend not available, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/v1/master/products:
    get:
      tags: [Master API]
      security:
        - jwtBearerAuth: []
      summary: List products
      responses:
        '200': {description: Product list, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MasterProduct'}}}}}
  /api/v1/master/modules:
    get:
      tags: [Master API]
      security:
        - jwtBearerAuth: []
