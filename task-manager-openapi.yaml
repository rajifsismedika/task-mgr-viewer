openapi: 3.0.3
info:
  title: TaskMgr Routine API
  version: "1.0.0"
  description: Curated machine-to-machine endpoints mounted under /api/v1, with a few legacy routine-only endpoints still under /api/v1/claude/routines.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Auth API
  - name: Task API
  - name: Search API
  - name: Master API
  - name: Routine API
  - name: Code Docs
  - name: Analytics API
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth API]
      summary: Authenticate with username and password
      description: >-
        Also the ONLY entry point for machine "rest-client" integration
        accounts (user.role == "rest-client", created via
        /admin/api-clients): those accounts are blocked from the web login
        UI entirely and authenticate here exclusively. Their JWT uses a
        longer, separately configured TTL (REST_CLIENT_TOKEN_TTL_SECONDS,
        default 7 days) than a human login, and `permissions` in the
        response is all-false (no task-lifecycle role/permission is ever
        granted to a rest-client account).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthLoginRequest'}
      responses:
        '200': {description: Login success, content: {application/json: {schema: {$ref: '#/components/schemas/AuthLoginResponse'}}}}
        '400': {description: Invalid payload, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Invalid credentials, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {description: Auth service unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/v1/auth/logout:
    post:
      tags: [Auth API]
      summary: Revoke the current JWT
      security:
        - jwtBearerAuth: []
      responses:
        '204': {description: Logged out}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {description: Auth service unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/v1/auth/me:
    get:
      tags: [Auth API]
      summary: Get the current authenticated user
      security:
        - jwtBearerAuth: []
      responses:
        '200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/AuthMeResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/v1/auth/impersonate:
    post:
      tags: [Auth API]
      summary: Admin-only — mint a JWT for another user
      description: >-
        Lets an authenticated Admin obtain a normal login-shaped JWT for
        another ACTIVE user, without that user's password. Mirrors the web
        "Login as user" impersonation flow but returns a bearer token instead
        of swapping the session cookie. Admin-only, enforced in-handler (the
        route itself only requires any valid bearer token).
      security:
        - jwtBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthImpersonateRequest'}
      responses:
        '200': {description: Impersonation token issued, content: {application/json: {schema: {$ref: '#/components/schemas/AuthLoginResponse'}}}}
        '400': {description: Invalid payload, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Admin role required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Target user not found or inactive, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {description: Auth service unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/v1/tasks:
    get:
      tags: [Task API]
      security:
        - jwtBearerAuth: []
      summary: List tasks
      parameters:
        - name: status
          in: query
          schema: {type: string}
        - name: product
          in: query
          schema: {type: string}
        - name: module
          in: query
          schema: {type: string}
        - name: type
          in: query
          schema: {type: string}
        - name: severity
          in: query
          schema: {type: string}
        - name: priority
          in: query
          schema: {type: string}
        - name: complexity
          in: query
          schema: {type: string}
        - name: tag
          in: query
          schema: {type: string}
        - name: stage
          in: query
          schema: {type: string, enum: [dev, qa, qc]}
        - name: assigneeUserID
          in: query
          schema: {type: string}
        - name: onHold
          in: query
          schema: {type: string, enum: [only, exclude]}
        - name: includeArchived
          in: query
          schema: {type: boolean, default: false}
        - name: search
          in: query
          description: >
            Free-text keyword search across task code, title/description
            substring, attachment filename, jam.dev/evidence link, and
            semantic/fulltext relevance — same multi-modal resolution as the
            web-UI keyword box. `keyword` and `q` are accepted as aliases.
          schema: {type: string}
        - name: page
          in: query
          schema: {type: integer, default: 1}
        - name: pageSize
          in: query
          schema: {type: integer, default: 10}
      responses:
        '200': {description: Paginated task list, content: {application/json: {schema: {$ref: '#/components/schemas/TaskListResponse'}}}}
    post:
      tags: [Task API]
      security:
        - jwtBearerAuth: []
      summary: Create task
      description: >
        Creates a top-level task or a sub-task. A request becomes a sub-task when
        `parentTaskID` is non-empty. File attachments are intentionally not part
        of this JSON contract.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoutineTaskCreateRequest'}}}
      responses:
        '201': {description: Created task summary, content: {application/json: {schema: {$ref: '#/components/schemas/RoutineTaskResponse'}}}}
        '400': {description: Malformed JSON or unknown fields, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '422': {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationErrorResponse'}}}}
        '500': {description: Repository or master-data failure, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/v1/latest-tasks:
    get:
      tags: [Task API]
      security:
        - jwtBearerAuth: []
      summary: List tasks updated within a window
      description: >
        Clone of GET /api/v1/tasks — same filters, same response shape — plus an
        updatedAfter/updatedBefore window so a client can pull only the latest
        data instead of re-fetching the whole list. Both bounds are optional and
        accept a bare date, a local datetime, or a full RFC3339 timestamp, all
        interpreted in the server's configured app timezone (APP_TIMEZONE,
        default Asia/Jakarta = UTC+7). A bare date as updatedAfter means
        00:00:00 that day; as updatedBefore it means 23:59:59 that day.
      parameters:
        - name: status
          in: query
          schema: {type: string}
        - name: product
          in: query
          schema: {type: string}
        - name: module
          in: query
          schema: {type: string}
        - name: type
          in: query
          schema: {type: string}
        - name: severity
          in: query
          schema: {type: string}
        - name: priority
          in: query
          schema: {type: string}
        - name: complexity
          in: query
          schema: {type: string}
        - name: tag
          in: query
          schema: {type: string}
        - name: stage
          in: query
          schema: {type: string, enum: [dev, qa, qc]}
        - name: assigneeUserID
          in: query
          schema: {type: string}
        - name: onHold
          in: query
          schema: {type: string, enum: [only, exclude]}
        - name: includeArchived
          in: query
          schema: {type: boolean, default: false}
        - name: updatedAfter
          in: query
          description: >
            Only include tasks updated at/after this moment. Accepts YYYY-MM-DD,
            YYYY-MM-DDTHH:MM:SS (app timezone), or RFC3339.
          schema: {type: string}
          examples:
            date: {value: '2026-07-13'}
            rfc3339: {value: '2026-07-13T09:30:00+07:00'}
        - name: updatedBefore
          in: query
          description: >
            Only include tasks updated at/before this moment. Accepts YYYY-MM-DD,
            YYYY-MM-DDTHH:MM:SS (app timezone), or RFC3339.
          schema: {type: string}
          examples:
            date: {value: '2026-07-13'}
            rfc3339: {value: '2026-07-13T09:30:00+07:00'}
        - name: page
          in: query
          schema: {type: integer, default: 1}
        - name: pageSize
          in: query
          schema: {type: integer, default: 10}
      responses:
        '200': {description: Paginated task list, content: {application/json: {schema: {$ref: '#/components/schemas/TaskListResponse'}}}}
        '400': {description: Invalid updatedAfter/updatedBefore format, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/v1/tasks/{id}:
    get:
      tags: [Task API]
      security:
        - jwtBearerAuth: []
      summary: Get task
      parameters:
        - $ref: '#/components/parameters/TaskID'
      responses:
        '200': {description: OK acknowledgement, content: {application/json: {schema: {$ref: '#/components/schemas/OKResponse'}}}}
    patch:
      tags: [Task API]
      security:
        - jwtBearerAuth: []
      summary: Update task metadata
      description: >
        Updates the same task metadata edited by the quick-edit flow. Omitted
        fields are left unchanged. On sub-tasks, `branchSource` is ignored and
        inherited from the parent task. File attachments are not supported here.
      parameters:
        - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoutineTaskPatchRequest'}}}
      responses:
        '200': {description: Updated task summary, content: {application/json: {schema: {$ref: '#/components/schemas/RoutineTaskResponse'}}}}
        '400': {description: Malformed JSON or unknown fields, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Task not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Task is in a conflicting state, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '422': {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationErrorResponse'}}}}
        '500': {description: Repository or master-data failure, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/v1/tasks/{id}/take:
    post:
      tags: [Task API]
      security:
        - jwtBearerAuth: []
      summary: Claim a reported task
      parameters:
        - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoutineActorRequest'}}}
      responses:
        '200': {description: Updated task summary, content: {application/json: {schema: {$ref: '#/components/schemas/RoutineTaskResponse'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Task not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Claim conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '422': {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationErrorResponse'}}}}
  /api/v1/tasks/{id}/dev-done:
